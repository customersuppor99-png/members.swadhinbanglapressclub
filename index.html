  <style>
    :root {
      --primary-navy: #0B192C;
      --secondary-navy: #1E3E62;
      --card-bg: #FFFFFF;
      --golden-accent: #D4AF37;
      --golden-hover: #AA820A;
      --text-dark: #1E293B;
      --text-muted: #64748B;
      --bg-gray: #F1F5F9;
      --border-color: #E2E8F0;
      --success-green: #10B981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Hind Siliguri', sans-serif;
    }

    body {
      background-color: var(--bg-gray);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header Styling */
    header {
      background: linear-gradient(135deg, var(--primary-navy) 0%, var(--secondary-navy) 100%);
      color: #fff;
      padding: 30px 15px;
      text-align: center;
      border-bottom: 4px solid var(--golden-accent);
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    .brand-icon {
      font-size: 42px;
      color: var(--golden-accent);
      margin-bottom: 10px;
    }

    header h1 {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 16px;
      color: #E2E8F0;
      font-weight: 400;
    }

    .container {
      max-width: 820px;
      width: 100%;
      margin: -25px auto 40px auto;
      padding: 0 15px;
      flex-grow: 1;
    }

    /* Search Box */
    .search-card {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border-color);
    }

    .search-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--primary-navy);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-group {
      display: flex;
      gap: 12px;
    }

    .search-input {
      flex: 1;
      padding: 14px 18px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: all 0.3s;
    }

    .search-input:focus {
      border-color: var(--golden-accent);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
    }

    .search-btn {
      background: var(--golden-accent);
      color: var(--primary-navy);
      font-weight: 700;
      padding: 0 25px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.3s, transform 0.1s;
    }

    .search-btn:hover {
      background: var(--golden-hover);
      color: #fff;
    }

    .search-btn:active {
      transform: scale(0.98);
    }

    /* Result Display */
    #resultArea {
      margin-top: 25px;
      display: none;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
      border: 1px solid var(--border-color);
    }

    .result-header {
      background: var(--primary-navy);
      color: #fff;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      border-bottom: 2px solid var(--golden-accent);
    }

    .member-meta h2 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
    }

    .member-meta p {
      font-size: 14px;
      color: #CBD5E1;
      margin-top: 4px;
    }

    .status-badge {
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid var(--golden-accent);
      color: var(--golden-accent);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .result-body {
      padding: 24px;
    }

    .section-headline {
      font-size: 17px;
      font-weight: 700;
      color: var(--primary-navy);
      margin-bottom: 12px;
      border-left: 4px solid var(--golden-accent);
      padding-left: 10px;
    }

    .welcome-text {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-dark);
      margin-bottom: 20px;
    }

    .doc-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 25px;
    }

    .doc-item {
      background: #F8FAFC;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .doc-check {
      color: var(--success-green);
      font-size: 18px;
      margin-top: 2px;
    }

    .doc-content h4 {
      font-size: 15px;
      font-weight: 600;
      color: var(--primary-navy);
      margin-bottom: 2px;
    }

    .doc-content p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .courier-notice {
      background: #EFF6FF;
      border: 1px solid #BFDBFE;
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .courier-notice h4 {
      color: #1E40AF;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .courier-notice p {
      font-size: 14px;
      color: #1E3A8A;
      line-height: 1.6;
    }

    .footer-note {
      text-align: center;
      padding: 16px;
      border-top: 1px dashed var(--border-color);
      color: var(--text-muted);
      font-size: 14px;
    }

    .footer-note strong {
      color: var(--primary-navy);
      font-size: 15px;
      display: block;
      margin-top: 4px;
    }

    /* Error Message */
    .error-card {
      background: #FFF1F2;
      border: 1px solid #FECDD3;
      color: #9F1239;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      font-size: 15px;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      font-size: 13px;
      border-top: 1px solid var(--border-color);
      background: #fff;
    }

    @media (max-width: 600px) {
      .search-group {
        flex-direction: column;
      }
      .search-btn {
        padding: 12px;
        justify-content: center;
      }
      .result-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    // মোবাইল নম্বর স্বাভাবিকীকরণ ফাংশন (+88, স্পেস ও হাইফেন মুক্ত করা)
    function normalizePhone(num) {
      if (!num) return "";
      let cleaned = num.toString().replace(/[^0-9]/g, '');
      if (cleaned.startsWith('880')) {
        cleaned = cleaned.substring(2);
      }
      return cleaned;
    }

    // সার্চ হ্যান্ডলার

      const input = document.getElementById("phoneInput").value.trim();
      const resultArea = document.getElementById("resultArea");
      const normalizedInput = normalizePhone(input);

        alert("অনুগ্রহ করে একটি মোবাইল নম্বর লিখুন।");
        return;

      const member = membersData.find(m => normalizePhone(m.phone) === normalizedInput);

      resultArea.style.display = "block";

                <div class="doc-item">

                <strong>স্বাধীন বাংলা প্রেসক্লাব — একনিষ্ঠতা আমাদের পথচলা।</strong>

      } else {
        resultArea.innerHTML = `
          <div class="error-card">

            অনুগ্রহ করে নম্বরটি যাচাই করুন অথবা স্বাধীন বাংলা প্রেসক্লাবের দায়িত্বপ্রাপ্ত ব্যক্তির সঙ্গে যোগাযোগ করুন।

        `;
      }
    }

    // Enter কী প্রেস করলে সার্চ কার্যকর হবে
    document.getElementById("phoneInput").addEventListener("keyup", function(event) {
      if (event.key === "Enter") {
        searchMember();
      }
    });
